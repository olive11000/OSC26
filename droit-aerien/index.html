<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mission DA · le droit aérien en jeu</title>
<meta name="description" content="Le cours de droit aérien (REG 01 à 19, COM 01, 02, 04) en 17 missions interactives : fiches, simulations 3D, QCM, examen blanc.">
<style>
:root{--bg:#060a14;--glass:rgba(11,17,30,.82);--glass2:rgba(19,28,48,.92);--line:rgba(140,170,230,.16);--txt:#eaf0fb;--dim:#93a1bd;
  --amber:#ffc35c;--cyan:#5fd6ff;--pink:#ff6fc8;--red:#ff6a4d;--blue:#5aa2ff;--green:#62e3a0;--violet:#b48cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
button{font:inherit;color:inherit}
/* haut */
#top{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5;max-width:calc(100% - 24px);pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:7px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:800;letter-spacing:.02em}
.brand i{font-style:normal}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;cursor:pointer}
#rank{display:flex;flex-direction:column;line-height:1.1;min-width:120px;position:relative;overflow:hidden;cursor:default}
#rank b{font-size:12.5px}#rank span{font-size:11px;color:var(--dim)}
#xpbar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--pink));width:0;transition:width .6s}
/* panneau */
#panel{position:fixed;z-index:6;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45)}
@media (min-width:761px){#panel{right:14px;top:14px;bottom:14px;width:430px;border-radius:20px}#grab{display:none}}
@media (max-width:760px){#panel{left:0;right:0;bottom:0;height:56vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom);transition:height .35s cubic-bezier(.2,.8,.2,1)}#panel.min{height:calc(64px + env(safe-area-inset-bottom))}#panel.tall{height:84vh}}
#grab{height:20px;display:flex;justify-content:center;align-items:center;cursor:pointer;flex:0 0 auto}
#grab:before{content:"";width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
.phead{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;flex:0 0 auto}
.phead h2{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bback{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700}
#view{flex:1;overflow:auto;padding:4px 14px 18px;overscroll-behavior:contain}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);font-weight:650;font-size:14px;padding:11px 14px;border-radius:12px;cursor:pointer;line-height:1.2}
.btn:hover{background:rgba(255,255,255,.12)}.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:linear-gradient(180deg,#3f8cff,#2a64d8);border-color:#5b9bff}
.btn.big{width:100%;padding:14px;font-size:15.5px;margin-top:8px}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.on{background:rgba(255,195,92,.18);border-color:rgba(255,195,92,.6)}
/* accueil */
.hero{background:linear-gradient(160deg,rgba(63,140,255,.18),rgba(180,140,255,.08));border:1px solid var(--line);border-radius:16px;padding:14px;margin:4px 0 12px}
.hero .h1{font-size:24px;font-weight:850;letter-spacing:-.01em}
.hero p{margin:6px 0 10px;color:#cdd7ea;font-size:14px}
.gradebox{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.gradebox span{font-weight:800;color:var(--amber)}.gradebox small{grid-column:1/3;color:var(--dim)}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--pink))}
.phase{margin:10px 0 4px}
.ph{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--pc);margin:0 0 6px;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.045);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:12px;padding:9px 10px;margin:0 0 6px;cursor:pointer}
.mrow:hover{background:rgba(255,255,255,.08)}
.mrow .num{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--dim);flex:0 0 auto}
.mrow .mi{font-size:19px}.mrow .mt{flex:1;display:flex;flex-direction:column;line-height:1.2}.mrow .mt small{color:var(--dim);font-size:11.5px}
.st i,.tb i{font-style:normal;color:rgba(255,255,255,.18);font-size:15px}.st i.on,.tb i.on{color:var(--amber);text-shadow:0 0 8px rgba(255,195,92,.7)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}.tools .btn{flex:1 1 30%}
.foot{color:var(--dim);font-size:11.5px;margin:12px 0 0}
/* mission */
.mhead .code{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.05em}
.mhead .pitch{margin:4px 0 8px;font-size:13.5px;color:#cdd7ea}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:8px}
.tabs .tb{flex:1;background:transparent;border:0;color:var(--dim);font-weight:700;font-size:13px;padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs .tb.on{background:rgba(255,255,255,.12);color:var(--txt)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 8px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16);cursor:pointer}.dots i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.dots i.done{background:rgba(95,214,255,.45)}
.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:0 0 10px}
.card.trap{border-color:rgba(255,106,77,.45);background:rgba(255,106,77,.07)}
.card.oral{border-color:rgba(98,227,160,.4);background:rgba(98,227,160,.06)}
.ctop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.03em}
.card h3{font-size:18px;margin:4px 0 8px;line-height:1.25}
.cbody p{margin:0 0 8px}.cbody ul,.cbody ol{margin:0 0 8px;padding-left:20px}.cbody li{margin:3px 0}
.cbody strong{color:#fff}
.cbody table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px;display:block;overflow-x:auto}
.cbody th,.cbody td{border:1px solid rgba(140,170,230,.2);padding:5px 6px;vertical-align:top;text-align:left}
.cbody th{background:rgba(90,162,255,.14);font-weight:700}
.cnav{display:flex;gap:8px;position:sticky;bottom:-18px;padding:8px 0 4px;background:linear-gradient(transparent,rgba(11,17,30,.95) 30%)}
.cnav .btn.pri{flex:1}
.oral label{display:flex;gap:9px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.oral input{width:20px;height:20px;margin-top:1px;accent-color:#62e3a0;flex:0 0 auto}
.hint{font-size:13px;color:var(--dim)}
/* quiz */
.qz .qtop{display:flex;justify-content:space-between;color:var(--dim);font-size:12.5px;font-weight:700}
.qbar{height:5px;border-radius:4px;background:rgba(255,255,255,.08);margin:6px 0 8px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--cyan);transition:width .3s}
.qstat{display:flex;gap:10px;align-items:center;font-size:13px;min-height:22px}
.combo{color:var(--dim);font-weight:700}.combo.on{color:var(--amber);text-shadow:0 0 8px rgba(255,195,92,.6)}
.qz h3{font-size:17.5px;margin:10px 0 12px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;line-height:1.35;cursor:pointer}
.opts button:hover:not(:disabled){background:rgba(255,255,255,.1)}
.opts button.ok{border-color:var(--green);background:rgba(98,227,160,.16)}.opts button.ko{border-color:var(--red);background:rgba(255,106,77,.14)}
.expl{margin:12px 0 4px;font-size:14px;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.05)}
.expl.good{border-left:3px solid var(--green)}.expl.bad{border-left:3px solid var(--red)}
.res{text-align:center}.res .big{font-size:42px;font-weight:850}.res .note{font-size:22px;font-weight:800;color:var(--amber)}
.res details{text-align:left;margin:10px 0}.res summary{cursor:pointer;font-weight:700;margin-bottom:6px}
.miss{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}.miss span{color:var(--green)}.miss small{color:var(--dim)}
.qbtns{display:flex;gap:8px;margin-top:10px}.qbtns .btn{flex:1}
.weak{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.weak b{width:100%;font-size:13px}
/* simu */
.simbox{display:block}
.sim h3{font-size:17px;margin:4px 0 6px}
.sim .art{background:#0a1222;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 10px;position:relative}
.sim .art svg{display:block;width:100%;height:auto}
.sim .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sim .row .btn{flex:1 1 40%}
.sim .kpi{display:flex;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--dim);font-weight:700;margin-bottom:6px}
.sim .big{font-size:20px;font-weight:800}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;margin:2px;background:rgba(255,255,255,.05)}
.range{display:flex;align-items:center;gap:10px;margin:6px 0}.range input{flex:1;accent-color:#4d95ff}.range output{min-width:110px;text-align:right;font-weight:700;font-size:13.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.msgbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0a1222;border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;margin:0 0 10px;color:#d9f2ff}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;margin:4px 0 10px}
.lex .lx{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:8px 2px}.lex .lx b{color:var(--cyan)}.lex .lx small{color:var(--dim)}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:30;background:var(--glass2);border:1px solid rgba(255,195,92,.45);border-radius:14px;padding:9px 14px;font-size:14px;transition:all .35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:761px){#toast{left:calc((100% - 444px)/2)}}
#loading{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s}
#loading .logo{font-size:44px;animation:fl 1.6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px) rotate(-6deg)}}
#loading p{color:var(--dim);margin:0}
#err{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--dim)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.08}}
.blink{animation:blink .7s steps(1) infinite}
</style>
</head>
<body>
<canvas id="c" aria-label="Monde 3D"></canvas>
<canvas id="fx"></canvas>
<div id="top">
  <div class="brand">✈️ <span>Mission DA</span></div>
  <div class="chip" id="rank"><b></b><span></span><i id="xpbar"></i></div>
  <div class="chip" id="stars"></div>
  <div class="chip" id="bsound" title="Son">🔊</div>
</div>
<div id="toast"></div>
<div id="panel">
  <div id="grab"></div>
  <div class="phead"><button id="bback">←</button><h2 id="ptitle"></h2></div>
  <div id="view"></div>
</div>
<div id="loading"><div class="logo">✈️</div><p>Préparation de la mission…</p></div>
<div id="err"><div><p style="font-size:17px;color:#fff">Ton appareil n'arrive pas à afficher la 3D (WebGL).</p><p>Essaie avec Safari ou Chrome à jour.</p></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
